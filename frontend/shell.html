<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090a">
  <title>GoDial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/01-tokens.css">
  <link rel="stylesheet" href="css/02-layout.css">
  <link rel="stylesheet" href="css/03-controls.css">
  <link rel="stylesheet" href="css/06-dialogs.css">
  <link rel="stylesheet" href="css/07-responsive.css">
  <link rel="stylesheet" href="css/09-shell.css">
  <link rel="stylesheet" href="css/linear/shell.css">
  <link rel="stylesheet" href="css/linear/document.css">
  <link rel="stylesheet" href="css/linear/controls.css">
  <link rel="stylesheet" href="css/linear/pipeline.css">
  <link rel="stylesheet" href="css/linear/workflow.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" defer></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <div id="loginGate" class="login-gate" hidden>
    <div class="login-card">
      <div class="login-brand"><svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M8 1.4a6.6 6.6 0 1 0 0 13.2a6.6 6.6 0 1 0 0-13.2Zm0 6.6L4.5 2.45 11.5 2.45Z"/></svg><span>GoDial</span></div>
      <h1>Sign in with Google</h1>
      <p>Each Gmail account has its own prospects, settings, and call history. You do not enter Supabase keys in the app.</p>
      <button id="googleSignInButton" class="button button-primary" type="button">Continue with Google</button>
      <p id="loginError" class="form-footnote" hidden></p>
    </div>
  </div>
  <div class="app-shell" hidden>
    <header class="app-top-chrome">
      <a class="brand app-top-brand" href="#crm" aria-label="GoDial home">
        <svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M8 1.4a6.6 6.6 0 1 0 0 13.2a6.6 6.6 0 1 0 0-13.2Zm0 6.6L4.5 2.45 11.5 2.45Z"/></svg>
        <span class="brand-name">GoDial</span>
      </a>
      <div class="app-top-tabs-wrap">
        <div class="dashboard-tabs app-top-tabs" role="tablist" aria-label="Workspace pages">
          <button id="prospectsTabButton" class="dashboard-tab" type="button" role="tab" aria-selected="false" aria-controls="prospectsTabPanel" tabindex="-1" data-dashboard-tab="prospects">Global CRM <span id="prospectTabCount" class="dashboard-tab-count">0</span></button>
          <button id="workflowTabButton" class="dashboard-tab" type="button" role="tab" aria-selected="false" aria-controls="workflowTabPanel" tabindex="-1" data-dashboard-tab="workflow">Workflow</button>
          <button id="pipelineTabButton" class="dashboard-tab" type="button" role="tab" aria-selected="false" aria-controls="pipelineTabPanel" tabindex="-1" data-dashboard-tab="pipeline">Pipeline</button>
        </div>
      </div>
      <div class="app-top-utilities top-actions">
        <span id="connectionState" class="connection-state"><span class="connection-dot"></span><span>Ready</span></span>
        <span id="accountEmail" class="account-email" hidden></span>
        <button id="settingsButton" class="app-top-utility-button" type="button" aria-haspopup="dialog">Settings</button>
        <button id="signOutButton" class="app-top-utility-button" type="button" hidden>Sign out</button>
      </div>
    </header>
