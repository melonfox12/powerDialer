<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090a">
  <title>GoDial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/01-tokens.css">
  <link rel="stylesheet" href="css/02-layout.css">
  <link rel="stylesheet" href="css/03-controls.css">
  <link rel="stylesheet" href="css/04-call-monitor.css">
  <link rel="stylesheet" href="css/05-charts.css">
  <link rel="stylesheet" href="css/06-dialogs.css">
  <link rel="stylesheet" href="css/07-responsive.css">
  <link rel="stylesheet" href="css/08-arcade.css">
  <link rel="stylesheet" href="css/09-shell.css">
  <link rel="stylesheet" href="css/linear/shell.css">
  <link rel="stylesheet" href="css/linear/document.css">
  <link rel="stylesheet" href="css/linear/controls.css">
  <link rel="stylesheet" href="css/linear/monitor.css">
  <link rel="stylesheet" href="css/linear/metrics.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.18.5/dist/twilio.min.js" defer></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <div id="loginGate" class="login-gate" hidden>
    <div class="login-card">
      <div class="login-brand"><svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M8 1.4a6.6 6.6 0 1 0 0 13.2a6.6 6.6 0 1 0 0-13.2Zm0 6.6L4.5 2.45 11.5 2.45Z"/></svg><span>GoDial</span></div>
      <h1>Sign in with Google</h1>
      <p>Each Gmail account has its own prospects, settings, and call history. You do not enter Supabase keys in the app.</p>
      <button id="googleSignInButton" class="button button-primary" type="button">Continue with Google</button>
      <p id="loginError" class="form-footnote" hidden></p>
    </div>
  </div>
  <div class="app-shell" hidden>
    <nav class="side-nav" aria-label="Workspace">
      <a class="brand side-brand" href="#crm" aria-label="GoDial home">
        <svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M8 1.4a6.6 6.6 0 1 0 0 13.2a6.6 6.6 0 1 0 0-13.2Zm0 6.6L4.5 2.45 11.5 2.45Z"/></svg>
        <span class="brand-name">GoDial</span>
      </a>
      <div class="side-section">Workspace</div>
      <div class="side-links" role="tablist" aria-label="Call desk views">
        <button id="dialerTabButton" class="side-link active" type="button" role="tab" aria-selected="true" aria-controls="dialerTabPanel" tabindex="0" data-dashboard-tab="dialer"><svg class="side-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h2l1 2.5-1.5 1a7 7 0 0 0 3 3l1-1.5 2.5 1v2A1.5 1.5 0 0 1 10 12 8.5 8.5 0 0 1 2 4a1.5 1.5 0 0 1 1.5-1.5Z"/></svg>Dialer</button>
        <button id="performanceTabButton" class="side-link" type="button" role="tab" aria-selected="false" aria-controls="performanceTabPanel" tabindex="-1" data-dashboard-tab="performance"><svg class="side-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5h11M4 13.5V8.5M8 13.5V4.5M12 13.5V6.5"/></svg>Performance</button>
        <button id="prospectsTabButton" class="side-link" type="button" role="tab" aria-selected="false" aria-controls="prospectsTabPanel" tabindex="-1" data-dashboard-tab="prospects"><svg class="side-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 8.2a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8ZM3.2 13.2c.4-2 2.3-3.2 4.8-3.2s4.4 1.2 4.8 3.2"/></svg>Prospects <span id="prospectTabCount" class="dashboard-tab-count">0</span></button>
        <button id="poolTabButton" class="side-link" type="button" role="tab" aria-selected="false" aria-controls="poolTabPanel" tabindex="-1" data-dashboard-tab="pool"><svg class="side-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h7"/></svg>Caller pool <span id="poolTabCount" class="dashboard-tab-count">0</span></button>
      </div>
      <div class="side-foot">
        <span id="connectionState" class="connection-state"><span class="connection-dot"></span><span>Ready</span></span>
        <span id="accountEmail" class="account-email" hidden></span>
        <button id="settingsButton" class="side-link" type="button" aria-haspopup="dialog"><svg class="side-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.4 2.2h3.2l.4 1.6a4.8 4.8 0 0 1 1.3.8l1.6-.5 1.6 2.7-1.2 1.1a4.7 4.7 0 0 1 0 1.6l1.2 1.1-1.6 2.7-1.6-.5a4.8 4.8 0 0 1-1.3.8l-.4 1.6H6.4l-.4-1.6a4.8 4.8 0 0 1-1.3-.8l-1.6.5-1.6-2.7 1.2-1.1a4.7 4.7 0 0 1 0-1.6L1.5 6.8l1.6-2.7 1.6.5a4.8 4.8 0 0 1 1.3-.8l.4-1.6Z"/><circle cx="8" cy="8" r="1.6"/></svg>Settings</button>
        <button id="signOutButton" class="side-link" type="button" hidden>Sign out</button>
      </div>
    </nav>
