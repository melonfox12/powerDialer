<div id="workflowTabPanel" class="dashboard-tab-panel workflow-tab-panel" role="tabpanel" aria-labelledby="workflowTabButton" hidden>
  <div class="workflow-shell">
    <h2 class="visually-hidden">Workflow builder</h2>
    <div class="workflow-body-row">
      <aside id="workflowNodeLibrary" class="workflow-node-library" aria-label="Node library" style="--workflow-library-width: 272px">
        <header class="workflow-library-header">
          <button type="button" id="workflowLibraryCollapseBtn" class="workflow-library-collapse" aria-expanded="true" aria-controls="workflowLibraryList" title="Collapse node library">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 4 6 8l4 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="workflow-library-title">Node library</span>
        </header>
        <div class="workflow-library-search-wrap">
          <input id="workflowLibrarySearch" type="search" class="workflow-library-search" placeholder="Search nodes…" autocomplete="off" aria-label="Search node library">
        </div>
        <div id="workflowLibraryList" class="workflow-library-list" role="list"></div>
        <div id="workflowLibraryResizer" class="workflow-library-resizer" role="separator" aria-orientation="vertical" aria-label="Resize node library" title="Drag to resize"></div>
      </aside>

      <div class="workflow-canvas-column">
        <div class="workflow-toolbar" role="toolbar" aria-label="Workflow canvas tools">
          <button id="workflowToolPan" type="button" class="workflow-toolbar-btn is-selected" data-workflow-tool="pan" aria-pressed="true" title="Hand — drag canvas, two-finger scroll to pan, pinch or Ctrl+scroll to zoom">
            <svg class="workflow-toolbar-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 3.2a1 1 0 0 1 1.4 0l1.1 1.1V3.3a1 1 0 1 1 2 0v3.1l2.1 2.1a2.2 2.2 0 0 1 .6 1.5v2.7a1 1 0 0 1-1.7.7L8.2 11.2l-2.9 2.3a1 1 0 0 1-1.6-.8V7.4c0-.6.2-1.1.6-1.5l1.3-1.3V4.2a1 1 0 0 1 0-1.4Z" fill="currentColor"/></svg>
            <span>Hand</span>
          </button>
          <button id="workflowToolAnchor" type="button" class="workflow-toolbar-btn" data-workflow-tool="anchor" aria-pressed="false" title="Anchor editor — drag connection points">
            <svg class="workflow-toolbar-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3 13 L8.1 7.9" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" />
              <path d="M11.2 3.6 8.1 7.9 10.15 9.05Z" fill="currentColor" />
            </svg>
            <span>Anchor editor</span>
          </button>
          <button id="workflowToolResize" type="button" class="workflow-toolbar-btn" data-workflow-tool="resize" aria-pressed="false" title="Size — drag node edges or corner to resize">
            <svg class="workflow-toolbar-icon" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="2.5" y="5" width="9" height="7.5" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.15" stroke-dasharray="2.4 1.6"/>
              <path d="M6.5 9.2 10.2 6.4 M10.2 6.4 H7.7 M10.2 6.4 V8.9" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Size</span>
          </button>
        </div>
        <div id="workflowViewport" class="workflow-viewport is-tool-pan" tabindex="0" aria-label="Workflow canvas">
          <div id="workflowWorld" class="workflow-world">
            <svg id="workflowEdges" class="workflow-edges" aria-hidden="true"></svg>
            <div id="workflowNodeLayer" class="workflow-node-layer"></div>
            <svg id="workflowEdgeArrows" class="workflow-edge-arrows" aria-hidden="true"></svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <dialog id="workflowNodeInfoDialog" class="workflow-agent-dialog workflow-node-info-dialog">
    <form method="dialog" class="workflow-agent-dialog-form">
      <h3 id="workflowNodeInfoTitle">Node</h3>
      <div id="workflowNodeInfoBody" class="workflow-node-info-body"></div>
      <div class="workflow-agent-dialog-actions">
        <button class="button button-quiet" value="cancel">Close</button>
      </div>
    </form>
  </dialog>
</div>
