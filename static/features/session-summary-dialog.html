<dialog id="sessionSummaryDialog" class="session-summary-dialog" aria-labelledby="sessionSummaryTitle">
      <section class="session-summary-content">
        <div class="dialog-heading"><div><div class="eyebrow">SESSION COMPLETE</div><h2 id="sessionSummaryTitle">Your call session</h2></div><button id="closeSessionSummary" class="dialog-close" type="button" aria-label="Close summary">×</button></div>
        <p id="sessionSummaryDuration" class="summary-duration"></p>
        <div id="sessionSummaryStats" class="summary-stats"></div>
        <p id="sessionComparison" class="session-comparison" hidden></p>
        <div class="dialog-actions"><button id="startNewSession" class="button button-primary" type="button">Start new session</button></div>
      </section>
    </dialog>
