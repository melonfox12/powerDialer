            <section id="metricsPanel" class="metrics-panel" aria-labelledby="metricsTitle" hidden>
              <div id="performanceTabPanel" class="dashboard-tab-panel performance-tab-panel" role="tabpanel" aria-labelledby="performanceTabButton">
                <div class="performance-document dialer-document">
                  <header class="performance-header">
                    <h2 id="metricsTitle" class="visually-hidden">Performance</h2>
                    <div class="performance-daily-goals" aria-label="Daily goals">
                      <div class="performance-goal-block">
                        <div class="performance-goal-head">
                          <span class="performance-goal-label">Conversations today</span>
                          <span class="performance-goal-value">
                            <strong id="dailyConversationsValue">0</strong>
                            <span class="performance-goal-sep">/</span>
                            <button id="dailyConversationGoalButton" class="performance-goal-edit" type="button" aria-label="Edit conversation goal">20</button>
                          </span>
                        </div>
                        <div id="dailyConversationTrack" class="performance-goal-track" role="progressbar" aria-labelledby="dailyConversationGoalButton" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0">
                          <div id="dailyConversationFill" class="performance-goal-fill performance-goal-fill-conversations"></div>
                        </div>
                      </div>
                      <div class="performance-goal-block">
                        <div class="performance-goal-head">
                          <span class="performance-goal-label">Talk time today</span>
                          <span class="performance-goal-value">
                            <strong id="dailyTalkValue">0m</strong>
                            <span class="performance-goal-sep">/</span>
                            <button id="dailyTalkGoalButton" class="performance-goal-edit" type="button" aria-label="Edit talk time goal in minutes">60m</button>
                          </span>
                        </div>
                        <div id="dailyTalkTrack" class="performance-goal-track" role="progressbar" aria-labelledby="dailyTalkGoalButton" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0">
                          <div id="dailyTalkFill" class="performance-goal-fill performance-goal-fill-talk"></div>
                        </div>
                      </div>
                    </div>
                  </header>

                  <section class="performance-chart-section" aria-labelledby="performanceChartTitle">
                    <div class="performance-chart-toolbar">
                      <h3 id="performanceChartTitle" class="performance-section-label">Activity</h3>
                      <div class="performance-mode-control" role="group" aria-label="Chart time range">
                        <button id="rangeDayButton" class="performance-mode-button" type="button" aria-pressed="false" data-performance-range="day">Day</button>
                        <button id="rangeWeekButton" class="performance-mode-button active" type="button" aria-pressed="true" data-performance-range="week">Week</button>
                        <button id="rangeMonthButton" class="performance-mode-button" type="button" aria-pressed="false" data-performance-range="month">Month</button>
                      </div>
                    </div>
                    <div id="performanceChartLegend" class="performance-line-legend" role="group" aria-label="Chart series"></div>
                    <div id="performanceLineChart" class="line-chart performance-line-chart" role="img" aria-label="Dials, conversations, and booked over time"></div>
                    <p id="performanceChartEmpty" class="performance-chart-empty" role="status" hidden>No activity in this range</p>
                  </section>

                  <section class="performance-funnel-row" aria-label="Funnel conversion rates">
                    <article class="performance-funnel-card">
                      <span class="performance-funnel-label">Dials → Connected</span>
                      <strong id="funnelRateConnect" class="performance-funnel-value">—</strong>
                      <div class="performance-funnel-bar" aria-hidden="true"><span id="funnelRateConnectBar"></span></div>
                    </article>
                    <article class="performance-funnel-card">
                      <span class="performance-funnel-label">Connected → Conversations</span>
                      <strong id="funnelRateConversation" class="performance-funnel-value">—</strong>
                      <div class="performance-funnel-bar" aria-hidden="true"><span id="funnelRateConversationBar"></span></div>
                    </article>
                    <article class="performance-funnel-card">
                      <span class="performance-funnel-label">Conversations → Booked</span>
                      <strong id="funnelRateBooked" class="performance-funnel-value">—</strong>
                      <div class="performance-funnel-bar" aria-hidden="true"><span id="funnelRateBookedBar"></span></div>
                    </article>
                  </section>
                </div>
              </div>
